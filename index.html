<!doctype html>
<html lang="en" class="i18n-loading">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OpenNEXT Native AI Capacity Market and RFQ MVP demo">
    <title>OpenNEXT · Native AI Capacity Market</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./phase1.css">
    <link rel="stylesheet" href="./procurement.css">
    <link rel="stylesheet" href="./i18n.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside id="sidebar" class="sidebar" aria-label="Main navigation">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">ON</div>
          <div><strong>OpenNEXT</strong><span>Native AI Capacity Market</span></div>
        </div>
        <nav class="nav-list">
          <button class="nav-item is-active" type="button" data-route="models" data-nav="models"><span class="nav-icon">M</span><span>Native Market</span></button>
          <button class="nav-item" type="button" data-route="gpus" data-nav="gpus"><span class="nav-icon">G</span><span>GPU Market</span></button>
          <button class="nav-item" type="button" data-route="data" data-nav="data"><span class="nav-icon">↗</span><span>Market Data</span></button>
          <button class="nav-item" type="button" data-route="rfq" data-nav="rfq"><span class="nav-icon">R</span><span class="nav-item-copy"><span>My RFQs</span><span class="nav-mini-badge">5</span></span></button>
          <button class="nav-item" type="button" data-route="supply" data-nav="supply"><span class="nav-icon">S</span><span class="nav-item-copy"><span>Supply / Respond</span><span class="nav-mini-badge">LIVE</span></span></button>
          <div class="nav-divider"></div>
          <div class="nav-section-label">More</div>
          <button class="nav-item" type="button" data-flow-action="messages"><span class="nav-icon">✉</span><span class="nav-item-copy"><span>Messages</span><span class="nav-mini-badge">3</span></span></button>
          <button class="nav-item" type="button" data-route="docs" data-nav="docs"><span class="nav-icon">?</span><span>Documentation</span></button>
          <button class="nav-item" type="button" data-proc-action="managed-gateway"><span class="nav-icon">⇄</span><span class="nav-item-copy"><span>Managed Gateway</span><span class="nav-mini-badge">OPTIONAL</span></span></button>
          <button class="nav-item" type="button" data-route="scheduler" data-nav="scheduler"><span class="nav-icon">✦</span><span class="nav-item-copy"><span>Capacity Optimizer</span><span class="nav-mini-badge">OPTIONAL</span></span></button>
        </nav>
        <div class="sidebar-lanes">
          <p>Market structure</p>
          <div><span class="status-dot status-dot-green"></span><strong>Native RFQ</strong><em>Core market</em></div>
          <div><span class="status-dot status-dot-amber"></span><strong>Private OTC</strong><em>Separate lane</em></div>
        </div>
        <div class="sidebar-account"><div class="avatar">DL</div><div><strong>Demo Workspace</strong><span>Enterprise buyer · Synthetic</span></div><button type="button" data-flow-action="account-menu" aria-label="Account menu">•••</button></div>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu" id="mobileMenu" type="button" data-action="toggle-mobile-nav" aria-label="Open navigation">☰</button>
            <div class="environment-chip"><span></span> MVP DEMO</div>
            <p>Synthetic data · No real transaction</p>
          </div>
          <div class="topbar-right">
            <div class="language-switch" role="group" aria-label="Language">
              <button type="button" data-locale="en" aria-label="Switch to English">EN</button>
              <button type="button" data-locale="zh-CN" aria-label="Switch to Chinese">ZH</button>
            </div>
            <button class="primary-button compact" type="button" data-proc-action="post-rfq">Post RFQ</button>
          </div>
        </header>
        <main id="mainContent"><div class="loading-view"><div><div class="loading-mark"></div><p>Loading Native Market…</p></div></div></main>
      </div>
    </div>
    <div id="drawer-host"></div>
    <div id="modal-host"></div>
    <div id="toast-host" class="toast-root" aria-live="polite"></div>
    <script type="module" src="./phase1-entry-v2.js"></script>
  </body>
</html>
